['INFY','Infosys','IT Services',1800,'IT consulting and digital services.','Project and managed-services fees from global clients.','TCS, Cognizant, HCLTech'],
['TATAMOTORS','Tata Motors','Automobiles',950,'Passenger vehicles, commercial vehicles and Jaguar Land Rover.','Vehicle sales plus financing and aftersales.','Maruti Suzuki, Mahindra, Hyundai'],
['ITC','ITC Ltd','FMCG',470,'Cigarettes, FMCG foods, hotels and paper.','Cigarette cash flows funding diversification into FMCG.','HUL, Nestlé India, Godrej'],
['AAPL','Apple Inc.','Technology',17500,'Consumer devices, software and services.','Hardware sales plus recurring services revenue.','Samsung, Google, Microsoft'],

['AMZN','Amazon.com','E-commerce & Cloud',15500,'Online retail, logistics and AWS cloud.','Marketplace and retail margins, AWS cloud, advertising.','Walmart, Microsoft, Flipkart']].map(a=>({sym:a[0],name:a[1],sec:a[2],base:a[3],desc:a[4],how:a[5],comp:a[6]}));
const IDX=[['NIFTY 50',24500],['SENSEX',80500],['NASDAQ',19000],['S&P 500',5800],['DOW JONES',42000],['FTSE 100',8200],['NIKKEI 225',38500],['GOLD $/oz',2650],['BRENT CRUDE $',74],['USD/INR',83.2]];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cache={};
function ser(k,base,n=1260,v=.016){const key=k+n;if(cache[key])return cache[key];const r=rng([...k].reduce((a,c)=>a*31+c.charCodeAt(0),7));let p=100,a=[];
for(let i=0;i<n;i++){const o=p,c=o*(1+(r()-.48)*v*2);a.push({o,c,h:Math.max(o,c)*(1+r()*v/2),l:Math.min(o,c)*(1-r()*v/2),v:Math.round(1e6*(.5+r()))});p=c}
const s=base/p;a.forEach(x=>{x.o*=s;x.h*=s;x.l*=s;x.c*=s});let d=new Date();d.setHours(0,0,0,0);
for(let i=n-1;i>=0;i--){while(d.getDay()%6==0)d.setDate(d.getDate()-1);a[i].t=new Date(d);d.setDate(d.getDate()-1)}return cache[key]=a}
const Q=sym=>{const s=ser(sym,ST.find(x=>x.sym==sym).base),l=s[s.length-1].c;return{p:l,ch:(l/s[s.length-2].c-1)*100}};
const sma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y)/n);
const boll=a=>a.map((_,i)=>{if(i<19)return null;const w=a.slice(i-19,i+1),m=w.reduce((x,y)=>x+y)/20,sd=Math.sqrt(w.reduce((x,y)=>x+(y-m)**2,0)/20);return[m-2*sd,m+2*sd]});
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(v=>e=v*k+e*(1-k))};
function rsi(a){let g=0,l=0;for(let i=1;i<=14;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}g/=14;l/=14;for(let i=15;i<a.length;i++){const d=a[i]-a[i-1];g=(g*13+Math.max(d,0))/14;l=(l*13+Math.max(-d,0))/14}return 100-100/(1+g/(l||1e-9))}
const dtf=t=>t.getHours()?t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):t.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'});
function tfData(sym,tf){const d=ser(sym,ST.find(x=>x.sym==sym).base);if(tf=='1D'){const i=ser(sym+'D',d[d.length-1].c,78,.003),o=new Date();o.setHours(9,15,0,0);const k=Math.max(1,Math.min(78,Math.floor((Date.now()-o)/3e5)+1));
if(!IDS[sym]||IDS[sym].k!=k)IDS[sym]={k,f:Q(sym).p/i[k-1].o};const F=IDS[sym].f;
return i.slice(0,k).map((x,j)=>{const p=Q(sym).p,op=x.o*F,c=j==k-1?p:x.c*F;return{...x,o:op,c,h:Math.max(x.h*F,c,op),l:Math.min(x.l*F,c,op),t:new Date(o.getTime()+j*3e5)}})}
return d.slice(-({'1W':5,'1M':22,'3M':66,'6M':126,'1Y':252,'5Y':1260,MAX:1260}[tf]))}
const spark=a=>{const mn=Math.min(...a),mx=Math.max(...a);return`<svg viewBox="0 0 100 28" width="100%" height="28" preserveAspectRatio="none"><polyline fill="none" stroke="${a[a.length-1]>=a[0]?'var(--g)':'var(--r)'}" stroke-width="1.5" points="${a.map((v,i)=>i+','+(26-(v-mn)/(mx-mn||1)*24)).join(' ')}"/></svg>`};
function line(a,x,y,c){let p='',on=0;a.forEach((v,i)=>{if(v==null){on=0;return}p+=(on?'L':'M')+x(i)+' '+y(v);on=1});return`<path d="${p}" fill="none" stroke="${c}" stroke-width="1.2"/>`}
function chart(id,d,type,ov){const el=$('#'+id),W=800,H=300,VH=50,R=52,n=d.length,w=(W-R)/n,cl=d.map(q=>q.c),bb=ov.bb?boll(cl):[];
let mn=Math.min(...d.map(q=>q.l)),mx=Math.max(...d.map(q=>q.h));bb.forEach(b=>{if(b){mn=Math.min(mn,b[0]);mx=Math.max(mx,b[1])}});
const y=v=>8+(H-16)*(1-(v-mn)/(mx-mn||1)),x=i=>i*w+w/2,vm=Math.max(...d.map(q=>q.v));let s=`<svg viewBox="0 0 ${W} ${H+VH}" width="100%" style="display:block;touch-action:pan-y">`;
for(let k=0;k<5;k++){const v=mn+(mx-mn)*k/4;s+=`<line x1="0" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--b)" stroke-width=".5"/><text x="${W-R+4}" y="${y(v)+3}" fill="var(--m)" font-size="10">${f(v,0)}</text>`}
d.forEach((q,i)=>{const c=q.c>=q.o?'var(--g)':'var(--r)',vh=q.v/vm*VH;s+=`<rect x="${i*w}" y="${H+VH-vh}" width="${Math.max(w-1,.5)}" height="${vh}" fill="${c}" opacity=".35"/>`;
if(type=='c')s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(q.h)}" y2="${y(q.l)}" stroke="${c}"/><rect x="${x(i)-w*.35}" y="${y(Math.max(q.o,q.c))}" width="${w*.7}" height="${Math.max(1,Math.abs(y(q.o)-y(q.c)))}" fill="${c}"/>`});
if(type=='l'){const p=cl.map((v,i)=>x(i)+','+y(v)).join(' ');s+=`<polygon points="${x(0)},${H} ${p} ${x(n-1)},${H}" fill="var(--a)" opacity=".1"/><polyline points="${p}" fill="none" stroke="var(--a)" stroke-width="1.6"/>`}
if(ov.sma)s+=line(sma(cl,20),x,y,'#f0b429');if(ov.bb){s+=line(bb.map(b=>b&&b[0]),x,y,'#9b8cff')+line(bb.map(b=>b&&b[1]),x,y,'#9b8cff')}
s+=`<g id="${id}x" style="display:none"><line id="${id}v" y1="0" y2="${H+VH}" stroke="var(--m)" stroke-dasharray="3"/><line id="${id}h" x1="0" x2="${W-R}" stroke="var(--m)" stroke-dasharray="3"/></g></svg><div class="tip" id="${id}t">Hover or touch the chart</div>`;el.innerHTML=s;
const sv=el.firstChild,g=$('#'+id+'x'),tp=$('#'+id+'t'),mv=e=>{HV=Date.now();const r=sv.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left,i=Math.max(0,Math.min(n-1,Math.floor(cx/r.width*W/w))),q=d[i],yy=y(q.c);g.style.display='';
$('#'+id+'v').setAttribute('x1',x(i));$('#'+id+'v').setAttribute('x2',x(i));$('#'+id+'h').setAttribute('y1',yy);$('#'+id+'h').setAttribute('y2',yy);tp.innerHTML=`${dtf(q.t)} · O ${f(q.o)} H ${f(q.h)} L ${f(q.l)} C <b>${f(q.c)}</b> · Vol ${f(q.v,0)}`};
sv.onmousemove=mv;sv.ontouchmove=mv;sv.onmouseleave=()=>{HV=0;g.style.display='none'}}
function mini(a,lab){const mx=Math.max(...a),mn=Math.min(...a,0);return`<svg viewBox="0 0 400 140" width="100%"><polyline fill="none" stroke="var(--g)" stroke-width="2" points="${a.map((v,i)=>(i/(a.length-1)*390+5)+','+(130-(v-mn)/(mx-mn||1)*120)).join(' ')}"/><text x="6" y="12" fill="var(--m)" font-size="10">${lab||''} max ${f(mx,0)}</text></svg>`}
const banner=`<div class="warn"><b>Simulated live data.</b> Prices, indices, rates and charts update in real time, but they are generated in your browser, not pulled from an exchange or data provider. Simulated trading is for learning only; no real money or brokerage is involved. Nothing here is investment advice.</div>`;

const LES=[['Compounding','Interest earns interest, so growth accelerates over time.','₹1,00,000 at 10% a year becomes about ₹6.7 lakh in 20 years.','Rate, time, reinvestment','At a fixed rate, doubling the time usually…',['Doubles the gain','More than doubles the gain','Halves the gain'],1],
['Risk & return','Higher expected returns usually come with larger possible losses.','Equities swing more than government bonds but have historically paid more over long periods.','Volatility, drawdown, diversification','Diversifying across assets mainly reduces…',['Fees','Specific (single-asset) risk','Inflation'],1],
['Stocks vs bonds','A stock is part ownership; a bond is a loan that pays interest.','Buying a company bond means lending to it for fixed coupons.','Equity, coupon, maturity','A bondholder is a…',['Part-owner','Lender','Employee'],1],
['Index funds & ETFs','They hold a basket of securities to track a market index cheaply.','An index fund tracking NIFTY 50 holds its 50 stocks in index weights.','Expense ratio, tracking error','Index funds mostly aim to…',['Beat the market','Match an index','Avoid all risk'],1],
['Valuation basics','Price relative to earnings, sales or cash flow hints at what the market expects.','A P/E of 20 means ₹20 paid per ₹1 of annual earnings.','P/E, P/B, DCF','A higher P/E generally implies…',['Higher growth expectations','Guaranteed profit','Lower price'],0],

const num=id=>parseFloat($('#'+id).value)||0,out=(id,h)=>$('#'+id).innerHTML=h,inp=(id,l,v,st=1)=>`<label for="${id}">${l}</label><input id="${id}" type="number" step="${st}" value="${v}">`;

function calcC(){const P=num('cP'),r=num('cR')/100,fq=num('cF'),y=Math.min(num('cY'),60),m=num('cM')*12/fq,a=[];for(let i=0;i<=y;i++){const k=(1+r/fq)**(fq*i);a.push(P*k+(r?m*(k-1)/(r/fq):m*fq*i))}
out('cO',`<div class="big up">${inr(a[y])}</div><div class="m">Contributed ${inr(P+num('cM')*12*y)} · growth ${inr(a[y]-P-num('cM')*12*y)}</div>`+mini(a,'Balance'))}
const compound=()=>`<div class="c"><h3>Compound interest</h3><div class="row"><div>${inp('cP','Principal (₹)',100000)}</div><div>${inp('cR','Annual rate %',10,.1)}</div></div><div class="row"><div>${inp('cY','Years',20)}</div><div><label for="cF">Compounding/yr</label><select id="cF" style="width:100%"><option>1</option><option>4</option><option selected>12</option><option>365</option></select></div></div>${inp('cM','Monthly contribution (₹)',0)}<button onclick="calcC()">Calculate</button><div id="cO"></div></div>`;
function calcI(){const a=num('iA'),r=num('iR')/100,y=num('iY');out('iO',`Same basket costs <b>${inr(a*(1+r)**y)}</b> after ${y} years.<br>${inr(a)} today buys only <b class="dn">${inr(a/(1+r)**y)}</b> worth of today’s goods.`)}

let NB=0,HV=0,tk=0,MF=0,PG='home';const IDS={},EV=[],band={};
const LP=k=>`<span data-lp="${k}">₹${f(Q(k).p)}</span>`,LC=k=>`<span data-lc="${k}">${up(Q(k).ch)}</span>`,IQ=n=>{const s=ser(n,IDX.find(x=>x[0]==n)[1],60,.008),l=s[59].c;return{p:l,ch:(l/s[58].c-1)*100,a:s.map(x=>x.c)}};
function tape(){const h=ST.map(s=>`<span class="tk"><b>${s.sym}</b> ${LP(s.sym)} ${LC(s.sym)}</span>`).join('');$('#tape').innerHTML=`<div class="tt">${h}${h}</div>`}
function mstat(){const n=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'})),s=n.getHours()*3600+n.getMinutes()*60+n.getSeconds(),wd=n.getDay()%6>0,o=wd&&s>=33300&&s<55800;let L;
if(o)L=55800-s;else if(wd&&s<33300)L=33300-s;else{let i=1;while((n.getDay()+i)%7%6==0)i++;L=i*86400-s+33300}
$('#ms').innerHTML=`<span class="${o?'up':'dn'}">●</span> NSE ${o?'open':'closed'} <span class="x">· ${o?'closes':'opens'} in ${Math.floor(L/3600)}h ${Math.floor(L%3600/60)}m ${L%60}s · ${n.toLocaleTimeString('en-IN')} IST <span title="Schedule-based; ignores holidays. Prices are simulated.">ⓘ</span></span>`}
const fl=(e,v,t)=>{const o=+e.dataset.v;e.dataset.v=v;if(e.textContent!=t)e.textContent=t;if(o&&v!=o){e.classList.remove('fu','fd');void e.offsetWidth;e.classList.add(v>o?'fu':'fd')}};
const qa=(a,fn)=>document.querySelectorAll(a).forEach(fn);
function paint(){qa('[data-lp]',e=>{const v=Q(e.dataset.lp).p;fl(e,v,'₹'+f(v))});qa('[data-lc]',e=>e.innerHTML=up(Q(e.dataset.lc).ch));
qa('[data-ip]',e=>{const v=IQ(e.dataset.ip).p;fl(e,v,f(v))});qa('[data-ic]',e=>e.innerHTML=up(IQ(e.dataset.ic).ch));qa('[data-is]',e=>e.innerHTML=spark(IQ(e.dataset.is).a));
qa('[data-sc]',e=>{const a=ST.filter(s=>s.sec==e.dataset.sc).map(s=>Q(s.sym).ch);e.innerHTML=up(a.reduce((x,y)=>x+y)/a.length)})}
function step(s,vol){const L=s[s.length-1];L.a=L.a||L.c;const o=L.c;L.c=o*(1+MF+(Math.random()-.5)*vol+.02*(L.a-o)/L.a);L.h=Math.max(L.h,L.c);L.l=Math.min(L.l,L.c);L.v+=Math.round(Math.random()*3e3)}
function evt(m,c){EV.unshift(`<div><span class="m">${new Date().toLocaleTimeString('en-IN')}</span> <span class="${c}">${m}</span></div>`);EV.length=Math.min(EV.length,10);$('#ev').innerHTML=EV.join('');if($('#nt').style.display!='block'){NB++;$('#bn').textContent=NB}}
function lrp(){const a=$('#ts'),b=$('#tq'),c=$('#te'),x=[a&&a.value,b&&b.value,c&&c.textContent];$('#main').innerHTML=R.portfolio();if(x[0]){$('#ts').value=x[0];$('#tq').value=x[1];$('#te').textContent=x[2]}}
function tick(){tk++;MF=MF*.92+(Math.random()-.5)*7e-4;
ST.forEach(x=>step(ser(x.sym,x.base),.0014));IDX.forEach(x=>step(ser(x[0],x[1],60,.008),.0007));
for(const k in FX)if(k!='USD'&&k!='INR')FX[k]*=1+(Math.random()-.5)*4e-4;FX.INR=IQ('USD/INR').p;
ST.forEach(x=>{const q=Q(x.sym),b=Math.trunc(q.ch);if(band[x.sym]!=null&&b!=band[x.sym])evt(`${x.sym} ${b>band[x.sym]?'rose':'fell'} to ${up(q.ch)} today`,q.ch>=0?'up':'dn');band[x.sym]=b});
paint();
if(PG=='stocks'&&tk%2==0&&Date.now()-HV>4e3)dr();
if(PG=='markets'&&tk%6==0)mk();
if(PG=='home'&&tk%10==0)$('#main').innerHTML=R.home();
if(PG=='portfolio'&&tk%3==0&&!/INPUT|SELECT/.test(document.activeElement.tagName))lrp();
if(PG=='economy'&&tk%2==0)fx();
if(tk%5==0)Object.values(S.pf).forEach(p=>{if(Object.keys(p.hold).length){p.snap.push(val(p));if(p.snap.length>300)p.snap.shift()}});
if(tk%30==0)save()}
addEventListener('hashchange',go);mstat();setInterval(mstat,1e3);go();tape();setInterval(tick,1000);
</script></body></html>
